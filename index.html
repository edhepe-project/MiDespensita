<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="MiDespensita - Tu lista de compras favorita">
  <meta name="theme-color" content="#f97316">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>MiDespensita</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="app-header">
    <button class="header-notif" id="header-notif" title="Notificaciones">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span class="notif-badge" id="notif-badge"></span>
    </button>
    <div class="header-center">
      <h1 class="app-title">MiDespensita</h1>
      <span class="app-subtitle" id="ubicacion-header">Tu lista de compras</span>
    </div>
    <button class="header-cuenta" id="btn-cuenta" title="Mi cuenta y configuración" onclick="window.location.hash='#config'">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </button>
  </header>

  <div id="notif-dropdown" class="notif-dropdown" style="display: none;">
    <div class="notif-dropdown-header">
      <h4>Notificaciones</h4>
      <button id="btn-cerrar-notifs">✕</button>
    </div>
    <div id="notif-list" class="notif-list">
      <!-- Las notificaciones van aquí -->
    </div>
  </div>

  <main id="app-content" class="app-main">
    <div class="loading">Cargando...</div>
  </main>

  <nav class="app-nav">
    <a href="#comprar" class="nav-item active" data-page="comprar">
      <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      <span class="nav-label">Comprar</span>
    </a>
    <a href="#productos" class="nav-item" data-page="productos">
      <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
      <span class="nav-label">Productos</span>
    </a>
    <a href="#precios" class="nav-item" data-page="precios">
      <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      <span class="nav-label">Precios</span>
    </a>
    <a href="#tiendas" class="nav-item" data-page="tiendas">
      <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span class="nav-label">Tiendas</span>
    </a>
  </nav>

  <!-- Librería de gráficas -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <script src="js/init.js"></script>
  <script src="js/dexie.min.js"></script>
  <script src="js/utils/constants.js"></script>
  <script src="js/utils/format.js"></script>
  <script src="js/utils/units.js"></script>
  <script src="js/utils/swipe.js"></script>
  <script src="js/utils/push.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/db.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/components/comprar.js"></script>
  <script src="js/components/productos.js"></script>
  <script src="js/components/precios.js"></script>
  <script src="js/components/comparar_semanas.js"></script>
  <script src="js/components/predicciones.js"></script>
  <script src="js/components/historial.js"></script>
  <script src="js/components/config.js"></script>
  <script src="js/components/local.js"></script>
  <script src="js/components/tiendas.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
